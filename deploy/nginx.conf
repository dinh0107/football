# ==============================================================================
# PREMIER LEAGUE TRACKER - PRODUCTION NGINX CONFIGURATION
# High Concurrency, HTTP/2, Gzip, 30-Day Static Caching & Cloudflare Real IP
# ==============================================================================

# Khai báo Upstream PHP-FPM
upstream php_backend {
    server unix:/var/run/php/php8.2-fpm.sock;
    # Hoặc nếu dùng TCP socket:
    # server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate Limiting Zones (Chống Spam / Brute Force)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# FastCGI Microcache Zone (Tùy chọn cho High Traffic)
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=MICROCACHE:20m max_size=512m inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name premierleague.local epl.example.com;

    # Hỗ trợ Cloudflare SSL Passthrough / ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/football/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name premierleague.local epl.example.com;

    root /var/www/football/public;
    index index.php index.html;

    charset utf-8;

    # --------------------------------------------------------------------------
    # SSL Configuration (TLS 1.2 / TLS 1.3 Hiện Đại)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/epl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epl.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # CLOUDFLARE REAL IP RESTORATION
    # Lấy chính xác địa chỉ IP người dùng đằng sau Proxy Cloudflare
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --------------------------------------------------------------------------
    # GZIP COMPRESSION (Tối Ưu Tải Trang & Băng Thông)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # 30-DAY STATIC ASSETS CACHING (CSS / JS / Images / Fonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Audio files (nhạc chuông bàn thắng)
    location ~* \.(?:mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # SITEMAP & ROBOTS.TXT
    # --------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # --------------------------------------------------------------------------
    # ADMIN AREA RATE LIMITING & SECURITY
    # --------------------------------------------------------------------------
    location ~ ^/admin/login$ {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API RATE LIMITING (Polling Livescore & Voting)
    location ~ ^/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # MAIN LARAVEL ENTRYPOINT
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # FASTCGI PHP-FPM PROCESSING
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Tối ưu hóa Buffer cho PHP-FPM High Concurrency
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_connect_timeout 10s;

        # Microcache cho các trang công khai (bỏ qua nếu có session auth/admin)
        set $skip_cache 0;
        if ($request_method = POST) { set $skip_cache 1; }
        if ($query_string != "")    { set $skip_cache 1; }
        if ($http_cookie ~* "laravel_session|XSRF-TOKEN") { set $skip_cache 1; }
        if ($request_uri ~* "/admin|/api/matches/.*/vote") { set $skip_cache 1; }

        fastcgi_cache MICROCACHE;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_valid 200 301 302 5s; # Microcache 5s cho trang tin
        add_header X-Microcache $upstream_cache_status;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
